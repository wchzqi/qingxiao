# Weasel settings
# encoding: utf-8

config_version: "0.23"

app_options:
  cmd.exe:
    ascii_mode: true
  conhost.exe:
    ascii_mode: true
  # ---- 游戏兼容白名单（P1-B8：suppress_panel 抑制浮动面板，保留中文输入）----
  YuanShen.exe:
    suppress_panel: true
    inline_preedit: false
  GenshinImpact.exe:
    suppress_panel: true
    inline_preedit: false
  StarRail.exe:
    suppress_panel: true
    inline_preedit: false
  ZenlessZoneZero.exe:
    suppress_panel: true
    inline_preedit: false
  WutheringWaves.exe:
    suppress_panel: true
    inline_preedit: false
  NarakaBladepoint.exe:
    suppress_panel: true
    inline_preedit: false
  DeltaForceClient-Win64-Shipping.exe:
    suppress_panel: true
    inline_preedit: false
  cs2.exe:
    suppress_panel: true
    inline_preedit: false
  dota2.exe:
    suppress_panel: true
    inline_preedit: false
  r5apex.exe:
    suppress_panel: true
    inline_preedit: false
  TslGame.exe:
    suppress_panel: true
    inline_preedit: false
  ModernWarfare.exe:
    suppress_panel: true
    inline_preedit: false
  VALORANT-Win64-Shipping.exe:
    suppress_panel: true
    inline_preedit: false
  LeagueClient.exe:
    suppress_panel: true
    inline_preedit: false
  League of Legends.exe:
    suppress_panel: true
    inline_preedit: false


show_notifications: true
# how long a period notifications shows
show_notifications_time: 1200
# use global ascii status
global_ascii: false

style:
  antialias_mode: default
  ascii_tip_follow_cursor: false
  color_scheme: qingxiao_cuilian
  color_scheme_dark: qingxiao_shuangyun
  font_face: Microsoft YaHei
  label_font_face: Microsoft YaHei
  comment_font_face: "Microsoft YaHei:Light"
  font_point: 14
  label_font_point: 13
  comment_font_point: 12
  candidate_abbreviate_length: 0
  click_to_capture: false
  horizontal: false
  fullscreen: false
  inline_preedit: false
  preedit_type: composition
  display_tray_icon: false
  label_format: "%s."
  mark_text: ""
  hover_type: semi_light # none / semi_light / hilite
  paging_on_scroll: false
  vertical_auto_reverse: false
  vertical_text: false
  vertical_text_left_to_right: false
  vertical_text_with_wrap: false
  layout:
    align_type: center
    max_width: 600   #青筱 P0：双阈值封顶超宽窗（0=不限）
    min_width: 200
    min_height: 0
    max_height: 0   #0 to disable max height
    border_width: 3
    margin_x: 12
    margin_y: 12
    spacing: 10
    candidate_spacing: 8
    hilite_spacing: 4
    hilite_padding: 4
    round_corner: 8   #卡片圆角（别名 hilited_corner_radius）
    corner_radius: 10 #外框圆角（外框略大卡片，约 1:0.8）
    shadow_radius: 12 #柔和投影高斯半径
    shadow_offset_x: 0
    shadow_offset_y: 4
    linespacing: 10 # percentage of font point, 0 to disable
    baseline: 0 # percentage of font point, 0 to disable

preset_color_schemes:
  aqua:
    name: 碧水／Aqua
    author: 佛振 <chen.sst@gmail.com>
    text_color: 0x000000                          #默认文字颜色
    back_color: 0xeceeee                          #候选窗背景色
    shadow_color: 0x00000000                      #候选窗阴影色，默认全透明（无阴影）
    border_color: 0xe0e0e0                        #候选窗边框颜色
    hilited_text_color: 0x000000                  #编码文字颜色
    hilited_back_color: 0xd4d4d4                  #编码背景颜色
    hilited_shadow_color: 0x00000000              #编码背景块阴影颜色
    hilited_candidate_text_color: 0xffffff        #高亮候选文字颜色
    hilited_candidate_back_color: 0xfa3a0a        #高亮候选背景颜色
    hilited_candidate_shadow_color: 0x00000000    #高亮候选背景块阴影颜色
    candidate_text_color: 0x000000                #非高亮候选文字颜色
    candidate_back_color: 0xeceeee                #非高亮候选背景颜色
    candidate_shadow_color: 0x00000000            #非高亮候选背景块阴影颜色

